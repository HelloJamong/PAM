name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --audit-level=high
          npm audit --prefix client --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: launcher/go.sum

      - name: Test launcher health contract
        working-directory: launcher
        run: go test ./health

      - name: Cross-build Windows launcher
        shell: bash
        working-directory: launcher
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-H windowsgui" -o /tmp/PAM.exe .
