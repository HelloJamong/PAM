name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build frontend
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go launcher
        shell: bash
        working-directory: launcher
        run: |
          go mod tidy
          go build -ldflags="-H windowsgui" -o ../PAM.exe .

      - name: Download portable Node.js runtime
        shell: pwsh
        run: |
          $version = "20.18.0"
          Invoke-WebRequest "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile "node-win.zip"
          Expand-Archive "node-win.zip" -DestinationPath "node-win-extract"
          New-Item -ItemType Directory -Path "runtime" -Force | Out-Null
          Get-ChildItem "node-win-extract" -Filter "node.exe" -Recurse |
            Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName "runtime\node.exe" }

      - name: Package release artifact
        shell: pwsh
        run: |
          $tag  = "${{ steps.version.outputs.version }}"
          $dist = "dist\PortableAssetManager"

          New-Item -ItemType Directory -Path "$dist\runtime" -Force | Out-Null
          New-Item -ItemType Directory -Path "$dist\data"    -Force | Out-Null
          New-Item -ItemType Directory -Path "$dist\backup"  -Force | Out-Null

          Copy-Item "PAM.exe"          "$dist\PAM.exe"
          Copy-Item "runtime\node.exe" "$dist\runtime\node.exe"
          Copy-Item "server"           "$dist\server"       -Recurse
          Copy-Item "node_modules"     "$dist\node_modules" -Recurse
          Copy-Item "package.json"     "$dist\package.json"

          Compress-Archive -Path "dist\*" -DestinationPath "PAM-$tag.zip"
          Write-Host "Packaged: PAM-$tag.zip"

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -n "/## \[${VERSION#v}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: PAM-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: bash
        run: |
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** PAM-${{ steps.version.outputs.version }}.zip" >> $GITHUB_STEP_SUMMARY
